name: CI

# Manual only (D-009): scripts/ci-local.sh on the Mac is the gate, so GitHub doesn't run CI on every
# push or PR. Run it by hand from the Actions tab if a second, clean-machine check is ever wanted.
on:
  workflow_dispatch:

jobs:
  guards:
    name: Guards (hard rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/guards.sh
        run: scripts/guards.sh

  host-tests:
    name: Host tests (core + doctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B build-host
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: Firmware (${{ matrix.board }}, IDF ${{ matrix.idf }}${{ matrix.diag && ', diag' || '' }})
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix:
        board: [generic, xiao]
        idf: [v5.3.1, v6.0.3]
        # diag must be a real matrix axis so the include entries add separate jobs.
        diag: [false]
        include:
          # Bring-up diagnostics on, so the CONFIG_PROBE_BRINGUP_DIAG code paths keep compiling.
          - { board: generic, idf: v5.3.1, diag: true }
          - { board: generic, idf: v6.0.3, diag: true }
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          # The checkout is owned by another uid than the container user; IDF runs
          # `git describe` for the app version and git refuses "dubious ownership" without this.
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          if [ "${{ matrix.diag }}" = "true" ]; then
            printf 'CONFIG_PROBE_BRINGUP_DIAG=y\n' > /tmp/diag.defaults
            idf.py -DPROBE_BOARD=${{ matrix.board }} -DPROBE_EXTRA_DEFAULTS=/tmp/diag.defaults build
          else
            idf.py -DPROBE_BOARD=${{ matrix.board }} build
          fi
      - name: Check effective sdkconfig
        shell: bash
        run: |
          if [ "${{ matrix.diag }}" = "true" ]; then
            scripts/guards.sh --sdkconfig sdkconfig --diag
          else
            scripts/guards.sh --sdkconfig sdkconfig
          fi
